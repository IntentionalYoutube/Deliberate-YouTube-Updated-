<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generate Icons for Deliberate YouTube</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    h1 {
      color: #333;
    }
    p {
      color: #666;
      margin-bottom: 20px;
    }
    .icon-preview {
      display: flex;
      gap: 20px;
      margin: 20px 0;
    }
    .icon-item {
      text-align: center;
    }
    canvas {
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    button {
      background: #4a90d9;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
    }
    button:hover {
      background: #357abd;
    }
  </style>
</head>
<body>
  <h1>Icon Generator</h1>
  <p>This page generates the required PNG icons for the Deliberate YouTube Chrome extension.</p>
  
  <div class="icon-preview">
    <div class="icon-item">
      <canvas id="icon16" width="16" height="16"></canvas>
      <p>16x16</p>
    </div>
    <div class="icon-item">
      <canvas id="icon48" width="48" height="48"></canvas>
      <p>48x48</p>
    </div>
    <div class="icon-item">
      <canvas id="icon128" width="128" height="128"></canvas>
      <p>128x128</p>
    </div>
  </div>
  
  <button onclick="downloadAllIcons()">Download All Icons</button>
  
  <script>
    function drawIcon(canvas, size) {
      const ctx = canvas.getContext('2d');
      const centerX = size / 2;
      const centerY = size / 2;
      
      // Background gradient (matches the extension's accent color)
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#ff8a5c');
      gradient.addColorStop(1, '#e85a24');
      
      // Rounded rectangle background
      ctx.fillStyle = gradient;
      ctx.beginPath();
      const radius = size * 0.22;
      ctx.roundRect(0, 0, size, size, radius);
      ctx.fill();
      
      // Play button triangle, optically centered. A right-pointing
      // triangle reads as off-center when its bounding box is centered,
      // so shift it slightly right of the geometric center.
      const w = size * 0.44;
      const h = w;
      const x = centerX - w * 0.5 + size * 0.035; // optical nudge right
      const y = centerY - h * 0.5;
      ctx.fillStyle = 'white';
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x, y + h);
      ctx.lineTo(x + w * 0.88, y + h * 0.5); // equilateral-ish width
      ctx.closePath();
      ctx.fill();
    }
    
    function downloadIcon(canvas, filename) {
      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
    
    function downloadAllIcons() {
      downloadIcon(document.getElementById('icon16'), 'icon16.png');
      downloadIcon(document.getElementById('icon48'), 'icon48.png');
      downloadIcon(document.getElementById('icon128'), 'icon128.png');
    }
    
    // Draw all icons on page load
    window.onload = function() {
      drawIcon(document.getElementById('icon16'), 16);
      drawIcon(document.getElementById('icon48'), 48);
      drawIcon(document.getElementById('icon128'), 128);
    };
  </script>
</body>
</html>
